    <!-- mobile-web-app-capable 是标准写法；带 apple- 前缀的那条已被 Chrome 标记为 deprecated，

    <!-- 结构化数据：让搜索引擎把它当成一个可免费使用的 Web 应用，而不是一篇文章 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "O My Beat",
        "alternateName": "O My Beat 节奏训练",
        "url": "__CANONICAL__",
        "description": "打开即玩的网页节奏与音感训练游戏，含鼓手、旋律家、节奏三种模式，四种曲风，48 小节 BPM 阶梯提速，支持离线与安装到桌面。",
        "applicationCategory": "GameApplication",
        "applicationSubCategory": "Music",
        "operatingSystem": "Web, Android, iOS, macOS, Windows",
        "browserRequirements": "需要支持 Service Worker 的现代浏览器",
        "inLanguage": "zh-CN",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" },
        "image": "__OG_IMAGE__",
        "screenshot": "__OG_IMAGE__",
        "featureList": [
          "鼓手模式：四轨打击，练节奏稳定性",
          "旋律家模式：双轨旋律，练音高与音感",
          "节奏模式：单轨时值，入门到挑战三档",
          "四种风格：Straight、Swing、Bossa、Math Rock",
          "48 小节阶梯提速，结算可续关加速",
          "离线可玩，可安装到桌面与主屏幕"
        ],
        "author": { "@type": "Person", "name": "aispin" }
      }
    </script>

    <!-- 在 React 挂载之前接住安装事件：beforeinstallprompt 只会抛一次，错过就没了 -->
    <script>
      window.__ombBIP = null;
      addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__ombBIP = e;
        dispatchEvent(new Event('omb:bip-ready'));
      });
      addEventListener('appinstalled', function () {
        window.__ombBIP = null;
        dispatchEvent(new Event('omb:installed'));
      });
    </script>
    <!-- 首屏兜底：JS 没到位时至少是个 O 在呼吸，而不是一片纯黑 -->
    <style>
      html,
      body {
        background: #07090d;
        color: #e7ecf3;
      }
      #boot[hidden] {
        display: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 9998;
      }
      #boot i {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        border: 5px solid transparent;
        background: linear-gradient(140deg, #5b8cff, #35d0ba) border-box;
        -webkit-mask:
          linear-gradient(#000 0 0) padding-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i {
          animation: none;
          opacity: 0.8;
        }
      }
      #fatal {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #07090d;
        font: 14px/1.7 -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      }
      #fatal[hidden] {
        display: none;
      }
      #fatal .card {
        width: 100%;
        max-width: 420px;
        padding: 24px 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        background: rgba(18, 22, 30, 0.9);
      }
      #fatal b {
        display: block;
        font-size: 15px;
        margin-bottom: 6px;
      }
      #fatal p {
        margin: 0 0 12px;
        color: #98a0b0;
        font-size: 12.5px;
      }
      #fatal pre {
        margin: 0 0 16px;
        padding: 10px 12px;
        max-height: 30vh;
        overflow: auto;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.45);
        color: #8ea2bb;
        font: 11px/1.6 ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #fatal button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 9px 16px;
        margin-right: 8px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #fatal [data-retry] {
        background: linear-gradient(140deg, #35d0ba, #5b8cff);
        color: #06100e;
        font-weight: 600;
      }
      #fatal [data-reset] {
        background: rgba(255, 255, 255, 0.08);
        color: #e7ecf3;
      }
    </style>
  </head>
  <body>
    <div id="boot"><i></i></div>
    <div id="root"></div>
    <div id="fatal" hidden>
      <div class="card">
        <b>没能启动起来</b>
        <p>把下面这段发给开发者，能直接定位原因。</p>
        <pre>未知原因</pre>
        <button type="button" data-retry>重试</button>
        <button type="button" data-reset>清缓存重试</button>
      </div>
    </div>

    <!-- 搜索引擎与禁 JS 环境的兜底：应用本体是 canvas，抓不到任何文本 -->
    <noscript>
      <div
        style="
          max-width: 640px;
          margin: 0 auto;
          padding: 48px 24px;
          font: 16px/1.75 -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
          color: #e7ecf3;
          background: #07090d;
        "
      >
        <h1 style="font-size: 26px; margin: 0 0 8px; letter-spacing: 2px">O My Beat</h1>
        <p style="color: #9aa6b8; margin: 0 0 24px">节奏练习 · 音感训练</p>
        <p>
          O My Beat 是一款打开即玩的网页节奏训练游戏。它把「跟拍子」这件事拆成三种练法：
          <strong>鼓手</strong>练四轨打击的稳定性，<strong>旋律家</strong>练双轨旋律的音高与音感，
          <strong>节奏</strong>只给一条轨，专心练时值长短。
        </p>
        <p>
          风格上提供 Straight、Swing、Bossa、Math Rock 四种曲风，拍号随风格走（4/4 与 7/8）。
          一局 48 小节，每 16 小节自动提速 10 BPM，难度是滚上去的而不是一开始就压死。
        </p>
        <p>
          游戏需要 JavaScript 与 Web Audio 才能运行。当前浏览器禁用了 JavaScript，
          请开启后刷新，或换用 Chrome / Edge / Safari 的最新版本。
        </p>
        <p style="color: #6b7688; font-size: 13px; margin-top: 32px">
          支持离线游玩，可以安装到桌面或主屏幕，像本地应用一样启动。
        </p>
      </div>
    </noscript>

    <!-- 启动看门狗：正常情况 #root 里早就长出 .app-shell 了。
         8 秒还是空的，说明脚本没跑起来（离线缓存错乱、浏览器拦了资源、
         某条旧代码在初始化时抛异常），这时候必须把原因显示出来，
         否则用户看到的只是「黑屏」，连反馈都无从说起。 -->
    <script>
      (function () {
        var errs = [];
        var box = document.getElementById('fatal');

        function envInfo() {
          var sw = 'serviceWorker' in navigator ? '注册中' : '不支持';
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.controller) sw = '已接管';
          } catch (e) {}
          return [
            'UA: ' + navigator.userAgent,
            '视口: ' + innerWidth + '×' + innerHeight + ' @' + (devicePixelRatio || 1) + 'x',
            'SW: ' + sw,
            '入口: ' + location.origin + location.pathname,
          ].join('\n');
        }

        function show() {
          if (!box || !box.hidden) return;
          box.hidden = false;
          var boot = document.getElementById('boot');
          if (boot) boot.hidden = true;
          box.querySelector('pre').textContent =
            (errs.length ? errs.join('\n') : '没有任何报错，但页面就是没渲染出来') + '\n\n' + envInfo();
        }

        addEventListener(
          'error',
          function (e) {
            var tag = e.target && e.target.tagName;
            if (tag === 'SCRIPT' || tag === 'LINK') {
              var bad = e.target.src || e.target.href || '';
              errs.push('资源加载失败：' + bad);
              /* 最常见的那种坏法：CDN 缓存了旧 HTML，而它引用的带 hash 的 JS
                 已经随新构建从服务器上删掉了 —— 页面永远起不来，刷新多少次都一样。
                 只有带一个新的查询串重新请求，才能把 HTML 也一起换掉。
                 只试一次，避免真的资源缺失时无限重载。 */
              try {
                if (/\/assets\//.test(bad) && !sessionStorage.getItem('omb.assetRetry')) {
                  sessionStorage.setItem('omb.assetRetry', '1');
                  var u = new URL(location.href);
                  u.searchParams.set('_r', Date.now().toString(36));
                  location.replace(u.toString());
                }
              } catch (err) {}
            } else {
              errs.push(
                (e.message || '脚本错误') +
                  (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : ''),
              );
            }
          },
          true,
        );
        addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          errs.push('未处理的 Promise：' + ((r && (r.message || r)) || ''));
        });

        function check() {
          if (document.documentElement.dataset.omb !== 'ready') show();
        }
        window.__ombShowFatal = function (msg) {
          if (msg) errs.push(String(msg));
          show();
        };
        setTimeout(check, 8000);
        addEventListener('load', function () {
          setTimeout(check, 1500);
        });
        box.querySelector('[data-retry]').onclick = function () {
          location.reload();
        };
        box.querySelector('[data-reset]').onclick = function () {
          var done = function () {
            location.reload();
          };
          if (!('serviceWorker' in navigator)) return done();
          var jobs = [];
          if (window.caches) {
            jobs.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) {
                  return caches.delete(k);
                }));
              }),
            );
          }
          jobs.push(
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) {
                return r.unregister();
              }));
            }),
          );
          Promise.all(jobs).then(done, done);
        };
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
